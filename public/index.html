<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Node</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0a0a0a; color: #00ff00; text-align: center; padding-top: 40px; margin: 0; }
        .container { background: #1a1a1a; margin: 20px auto; padding: 20px; border-radius: 8px; width: 80%; max-width: 400px; box-shadow: 0 0 15px rgba(0,255,0,0.2); }
        .status { margin-top: 15px; font-weight: bold; color: #ffeb3b; }
        .warning { color: #ff4444; font-size: 0.8em; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Live Security Node</h2>
        <div class="status" id="statusText">Initializing...</div>
        <p class="warning">⚠️ Do NOT close this tab or lock the screen. Brightness can be set to 0.</p>
    </div>

    <!-- Hidden Video & Canvas -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const statusText = document.getElementById('statusText');
        const socket = io();
        let wakeLock = null;

        // Prevent Screen from Sleeping
        async function keepScreenAwake() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock active');
                }
            } catch (err) {
                console.log(`Wake Lock error: ${err.message}`);
            }
        }

        socket.on('connect', () => {
            statusText.innerText = "🟢 Connected to Bot Server! Waiting for commands...";
            keepScreenAwake();
        });

        socket.on('disconnect', () => {
            statusText.innerText = "🔴 Disconnected! Retrying...";
        });

        // Triggered via Telegram /more
        socket.on('capture_command', async () => {
            statusText.innerText = "📸 Remote capture initiated...";
            await startCameraAndCapture();
            statusText.innerText = "🟢 Connected! Waiting for commands...";
        });

        async function startCameraAndCapture() {
            try {
                // Access Back Camera
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                await new Promise(resolve => video.onloadedmetadata = resolve);

                // Capture 5 photos
                for (let i = 0; i < 5; i++) {
                    await captureAndSend(video, i + 1);
                    await new Promise(resolve => setTimeout(resolve, 1500)); // 1.5s delay
                }

                // Stop camera to save battery
                stream.getTracks().forEach(track => track.stop());

            } catch (error) {
                statusText.innerText = "❌ Camera Error: Permissions denied?";
                console.error(error);
            }
        }

        async function captureAndSend(video, index) {
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            return new Promise((resolve) => {
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('photo', blob, `capture_${index}.jpg`);
                    
                    try {
                        // Send securely to our Node.js Backend, NOT directly to Telegram
                        await fetch('/upload', { method: 'POST', body: formData });
                    } catch (err) {
                        console.error("Upload failed", err);
                    }
                    resolve();
                }, 'image/jpeg', 0.8); // 0.8 quality for fast transmission
            });
        }
        
        // Re-apply Wakelock if tab visibility changes
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') keepScreenAwake();
        });
    </script>
</body>
</html>
